<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>HM Account</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
<main id="app">
  <section id="setupView" class="setup-view">
    <h1>HM Account</h1>
    <p class="muted">Connect directly to another person.</p>
    <div id="qrCode" class="qr-code"></div>
    <button id="copyCode" class="primary-button" type="button">Copy Request</button>
    <div class="setup-separator"></div>
    <label class="sr-only" for="pasteCode">Paste connection code</label>
    <textarea id="pasteCode" placeholder="Paste connection code…" rows="3"></textarea>
    <p id="error" class="error" role="status" aria-live="polite"></p>
  </section>

  <section id="chat" class="chat-view" hidden>
    <header class="chat-header"><strong>HM Account</strong><span id="connectionStatus">Connected</span></header>
    <div id="messages" class="messages" aria-live="polite"></div>
  </section>

  <section id="composeView" class="compose-view" hidden>
    <textarea id="composeText" placeholder="Write a message…" aria-label="Message"></textarea>
    <div class="compose-tools">
      <div class="chart-tools" aria-label="Risk management charts">
        <button class="chart-tool" data-chart="avoidance" aria-label="Avoidance chart" title="Avoidance"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M7 15l4-5 3 3 5-7"/></svg></button>
        <button class="chart-tool" data-chart="lossPrevention" aria-label="Loss prevention chart" title="Loss prevention"><svg viewBox="0 0 24 24"><path d="M5 19V9h4v10M11 19V5h4v14M17 19v-7h4v7"/></svg></button>
        <button class="chart-tool" data-chart="lossReduction" aria-label="Loss reduction chart" title="Loss reduction"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9zM14 3.3V10h6.7A9 9 0 0 0 14 3.3Z"/></svg></button>
        <button class="chart-tool" data-chart="duplication" aria-label="Duplication chart" title="Duplication"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="12" height="12" rx="1"/><path d="M8 20h12V8"/></svg></button>
        <button class="chart-tool" data-chart="separation" aria-label="Separation chart" title="Separation"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
        <button class="chart-tool" data-chart="diversification" aria-label="Diversification chart" title="Diversification"><svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="3"/><circle cx="17" cy="6" r="2"/><circle cx="15" cy="17" r="4"/><path d="m9.5 9.5 3 4M10 7l5-1M8 11l5 5"/></svg></button>
      </div>
      <button id="helpButton" class="icon-button" type="button" aria-label="Chart descriptions" title="Chart descriptions"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.2 1.8c-1.2 1-1.8 1.3-1.8 3M12 17.5v.1"/></svg></button>
    </div>
    <p class="tool-hint">Charts are reference tools. Only your written message is sent.</p>
  </section>

  <nav id="toolbar" class="toolbar" aria-label="Chat controls">
    <button id="versionButton" class="icon-button" type="button" aria-label="Version history" title="Version history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg></button>
    <div class="toolbar-spacer"></div>
    <button id="cancelComposeButton" class="icon-button" type="button" aria-label="Cancel composing" title="Cancel" hidden><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <button id="composeButton" class="icon-button" type="button" aria-label="Compose message" title="Compose message"><svg viewBox="0 0 24 24"><path d="m4 20 4.5-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20Z"/><path d="m14.5 6.5 3 3"/></svg></button>
    <button id="composeSend" class="icon-button" type="button" aria-label="Send message" title="Send message" hidden><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg></button>
  </nav>

  <section id="chartDialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="chartTitle" hidden>
    <div class="dialog-card"><header><h2 id="chartTitle">Chart</h2><button class="icon-button dialog-close" type="button" aria-label="Close">×</button></header><div class="chart-wrap"><canvas id="chartCanvas"></canvas></div></div>
  </section>
  <section id="helpDialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle" hidden>
    <div class="dialog-card"><header><h2 id="helpTitle">Risk management charts</h2><button class="icon-button dialog-close" type="button" aria-label="Close">×</button></header><div id="chartDescriptions" class="descriptions"></div></div>
  </section>
  <section id="versionPanel" class="version-panel" hidden>
    <header><strong>Version history</strong><button id="closeVersionPanel" class="icon-button" type="button" aria-label="Close">×</button></header>
    <div id="versionsList"></div>
    <div class="version-actions"><button id="saveVersionButton" type="button">Save version</button><button id="exportChatsButton" type="button">Export chats</button><button id="importChatsButton" type="button">Import chats</button><input id="chatFile" type="file" accept="application/json" hidden></div>
  </section>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
