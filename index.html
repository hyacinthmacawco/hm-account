<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>HM Account</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@codedgar/puppertino@2.0.0/dist/css/puppertino-mobile.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@codedgar/puppertino@2.0.0/src/js/modals.js"></script>
</head>
<body class="p-type p-auto-dark-mode" style="--p-control-accent:#1769e0;--p-button-default-tint:#1769e0;color-scheme:light dark">
<main id="app">
  <section id="setupView" class="p-container p-pane-scroll" aria-label="Connect">
    <p>Connect directly to another person.</p>
    <div id="qrCode" aria-label="Connection QR code"></div>
    <button id="copyCode" class="p-button p-button-touch-large p-button-primary" type="button">Copy Request</button>
    <div class="p-field-group-touch">
      <label class="p-label" for="pasteCode">Connection code</label>
      <textarea id="pasteCode" class="p-field p-field-touch" placeholder="Paste connection code…" rows="3"></textarea>
    </div>
    <p id="error" role="status" aria-live="polite"></p>
  </section>

  <header id="topbar" class="p-nav-bar p-nav-bar-filled" aria-label="Chat navigation" hidden>
    <div class="p-nav-bar__row">
      <div class="p-nav-bar__group">
        <button id="chatMenuButton" class="p-nav-bar__button" type="button" aria-label="Chats" title="Chats"><i class="ph-bold ph-list" aria-hidden="true"></i></button>
        <button id="newChatTopButton" class="p-nav-bar__button" type="button" aria-label="New chat" title="New chat"><i class="ph-bold ph-pencil-simple" aria-hidden="true"></i></button>
      </div>
      <h1 class="p-nav-bar__title">Messages</h1>
      <div class="p-nav-bar__group">
        <button id="openChatButton" class="p-nav-bar__button" type="button" aria-label="Open chat" title="Open chat"><i class="ph-bold ph-folder-open" aria-hidden="true"></i></button>
        <button id="saveChatButton" class="p-nav-bar__button" type="button" aria-label="Save chats" title="Save chats"><i class="ph-bold ph-floppy-disk" aria-hidden="true"></i></button>
      </div>
    </div>
  </header>

  <section id="workspace" class="p-pane-scroll" hidden>
    <nav id="chatMenu" class="p-sidebar p-sidebar-touch p-sidebar-touch-floating" hidden aria-label="Chats">
      <ul id="chatList" class="p-list p-list-touch"></ul>
    </nav>
    <section id="chat" aria-label="Conversation" hidden>
      <ul id="messages" class="p-list p-list-touch" aria-live="polite"></ul>
    </section>
    <section id="composeView" class="p-pane-scroll" hidden>
      <div class="p-container">
        <h2 class="p-list-touch-header p-list-touch-header--prominent">New message</h2>
        <div class="p-field-group-touch">
          <textarea id="messageDraft" class="p-field p-field-touch" rows="3" placeholder="Write a message…" aria-label="Message"></textarea>
        </div>
      </div>
      <div class="p-container">
        <h2 class="p-list-touch-header p-list-touch-header--prominent">Charts</h2>
        <ul id="pendingCharts" class="p-list p-list-touch p-list-inset"></ul>
        <h3 class="p-list-touch-header">Add a chart</h3>
        <ul class="p-list p-list-touch p-list-inset">
          <li class="p-list-row"><button class="p-button p-button-touch p-button-borderless chart-tool" data-chart="avoidance" type="button"><span class="p-list-label"><span class="p-list-title">Avoidance</span></span><i class="ph-bold ph-plus-circle p-list-trailing-icon" aria-hidden="true"></i></button></li>
          <li class="p-list-row"><button class="p-button p-button-touch p-button-borderless chart-tool" data-chart="lossPrevention" type="button"><span class="p-list-label"><span class="p-list-title">Loss prevention</span></span><i class="ph-bold ph-plus-circle p-list-trailing-icon" aria-hidden="true"></i></button></li>
          <li class="p-list-row"><button class="p-button p-button-touch p-button-borderless chart-tool" data-chart="lossReduction" type="button"><span class="p-list-label"><span class="p-list-title">Loss reduction</span></span><i class="ph-bold ph-plus-circle p-list-trailing-icon" aria-hidden="true"></i></button></li>
          <li class="p-list-row"><button class="p-button p-button-touch p-button-borderless chart-tool" data-chart="duplication" type="button"><span class="p-list-label"><span class="p-list-title">Duplication</span></span><i class="ph-bold ph-plus-circle p-list-trailing-icon" aria-hidden="true"></i></button></li>
          <li class="p-list-row"><button class="p-button p-button-touch p-button-borderless chart-tool" data-chart="separation" type="button"><span class="p-list-label"><span class="p-list-title">Separation</span></span><i class="ph-bold ph-plus-circle p-list-trailing-icon" aria-hidden="true"></i></button></li>
          <li class="p-list-row"><button class="p-button p-button-touch p-button-borderless chart-tool" data-chart="diversification" type="button"><span class="p-list-label"><span class="p-list-title">Diversification</span></span><i class="ph-bold ph-plus-circle p-list-trailing-icon" aria-hidden="true"></i></button></li>
        </ul>
        <button id="helpButton" class="p-button p-button-touch p-button-secondary" type="button" data-p-open-modal="#helpSheet">Chart help</button>
      </div>
    </section>
  </section>

  <input id="loadChatFile" type="file" accept="application/json" hidden>
  <div id="toolbar" class="p-toolbar-touch p-toolbar-touch-fixed" role="toolbar" aria-label="Chat controls" hidden>
    <button id="cancelComposeButton" class="p-toolbar-touch__item" type="button" hidden>Cancel</button>
    <button id="composeButton" class="p-toolbar-touch__item p-toolbar-touch-prominent" type="button" aria-label="Compose chart message" title="Compose chart message"><i class="ph-bold ph-pencil-simple" aria-hidden="true"></i></button>
  </div>

  <div class="p-modal-background" id="helpDialog">
    <section class="p-modal p-bottom-sheet p-bottom-sheet-large" id="helpSheet" data-p-close-on-outside="true" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="helpTitle">
      <div class="p-bottom-sheet__grabber"></div>
      <header class="p-bottom-sheet__header">
        <button class="p-button p-button-touch-small p-button-borderless dialog-close" type="button" data-p-cancel>Close</button>
        <h2 class="p-bottom-sheet__title" id="helpTitle">Risk management charts</h2>
      </header>
      <div class="p-bottom-sheet__body p-container">
        <div id="chartDescriptions"></div>
      </div>
    </section>
  </div>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
